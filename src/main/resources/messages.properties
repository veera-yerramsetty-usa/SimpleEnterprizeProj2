# =====================================================================
# Default (English) message bundle
# =====================================================================

# --- User validation ---
validation.user.username.required=Username is required
validation.user.username.size=Username must not exceed {max} characters
validation.user.username.pattern=Username must contain only alphanumeric characters, underscores, or hyphens
validation.user.username.patch.size=Username must be between {min} and {max} characters
validation.user.email.required=Email is required
validation.user.email.valid=Email must be valid
validation.user.email.size=Email must not exceed {max} characters
validation.user.password.required=Password is required
validation.user.password.size=Password must be between {min} and {max} characters
validation.user.password.pattern=Password must contain at least one uppercase letter, one lowercase letter, and one digit
validation.user.role.size=Role must not exceed {max} characters
validation.user.role.pattern=Role must contain only alphanumeric characters or underscores

# --- Employee validation ---
validation.employee.firstName.required=First name is required
validation.employee.firstName.size=First name must not exceed {max} characters
validation.employee.firstName.pattern=First name must contain only letters, spaces, hyphens, or apostrophes
validation.employee.firstName.patch.size=First name must be between {min} and {max} characters
validation.employee.lastName.required=Last name is required
validation.employee.lastName.size=Last name must not exceed {max} characters
validation.employee.lastName.pattern=Last name must contain only letters, spaces, hyphens, or apostrophes
validation.employee.lastName.patch.size=Last name must be between {min} and {max} characters
validation.employee.email.required=Email is required
validation.employee.email.valid=Email must be valid
validation.employee.email.size=Email must not exceed {max} characters
validation.employee.phone.size=Phone must not exceed {max} characters
validation.employee.phone.pattern=Phone must contain only digits, spaces, +, -, or parentheses

# --- Department validation ---
validation.department.name.required=Name is required
validation.department.name.size=Name must not exceed {max} characters
validation.department.name.pattern=Name must contain only letters, spaces, hyphens, or apostrophes
validation.department.name.patch.size=Name must be between {min} and {max} characters
validation.department.description.size=Description must not exceed {max} characters
validation.department.description.pattern=Description must contain only letters, digits, spaces, or common punctuation

# --- Webhook validation ---
validation.webhook.url.required=URL is required
validation.webhook.url.size=URL must not exceed {max} characters
validation.webhook.url.pattern=URL must start with http:// or https://
validation.webhook.entityType.required=Entity type is required
validation.webhook.entityType.pattern=Entity type must be User, Employee, Department, or *
validation.webhook.eventType.required=Event type is required
validation.webhook.eventType.pattern=Event type must be CREATED, UPDATED, DELETED, or *
validation.webhook.secret.required=Secret is required
validation.webhook.secret.size=Secret must be between {min} and {max} characters

# --- Bulk validation ---
validation.bulk.id.required=ID is required
validation.bulk.data.required=Data is required

# --- Error messages ---
error.not.found.user=User not found with id {0}
error.not.found.employee=Employee not found with id {0}
error.not.found.department=Department not found with id {0}
error.not.found.webhook=Webhook not found with id {0}
error.validation.failed=Input validation failed
error.conflict.unique=A resource with the given unique field(s) already exists
error.type.mismatch=Parameter ''{0}'' must be of type {1}
error.malformed.json=Malformed JSON request body
error.service.unavailable=Service is temporarily unavailable, please try again later
error.bulkhead.full=Too many concurrent requests, please try again later
error.unexpected=An unexpected error occurred
error.idempotency.conflict=A request with this idempotency key is already being processed
error.not.found.job.execution=Job execution not found with id {0}
